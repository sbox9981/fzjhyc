[custom]
; Clash / ACL4SSR custom 配置（已清理）
; 说明：
; - 建议把 ruleset URL 固定到具体 commit SHA（raw.githubusercontent.com/.../<commit_sha>/...）
; - 建议在测试通过后再把 overwrite_original_rules 改为 true
; - 建议为 url-test 提供多个备选 probe URL（示例中仅列出主 probe）

; 基本信息（勿随意修改关键字）
;acl4SSR规则-在线更新版
;去广告：支持
;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：不支持
;增强国外GFW：不支持
;多国家分组：支持港/日/美

ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/CMBlog.list
ruleset=🐟 漏网之鱼,FINAL

; ---------- 代理组定义 ----------
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择[]🇭🇰 香港节点[]🇬🇧 英国节点[]🇯🇵 日本节点[]🇸🇬 新加坡节点[]🇹🇼 台湾节点[]🇺🇲 美国节点[]🇰🇷 韩国节点[]🇩🇪 德国节点[]🇳🇱 荷兰节点[]🇸🇪 瑞典节点[]🇨🇦 加拿大节点[]🇦🇺 澳大利亚节点[]🇨🇭 瑞士节点[]🇩🇰 丹麦节点[]🇫🇮 芬兰节点[]🇮🇪 爱尔兰节点[]🇺🇦 乌克兰节点[]🇫🇷 法国节点[]☑️ 手动切换[]DIRECT
custom_proxy_group=☑️ 手动切换`select`[]DIRECT
; 自动选择（测速），probe URL 可增加备用，例如 google generate_204
custom_proxy_group=♻️ 自动选择`url-test`[]`https://zlcs.haba.dpdns.org/204`300,5,50
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择[]♻️ 自动选择[]☑️ 手动切换[]DIRECT
custom_proxy_group=🎥 奈飞视频`select`[]🚀 节点选择[]♻️ 自动选择[]☑️ 手动切换[]DIRECT`(NF|奈飞|Netflix|NETFLIX|Media|MITM)
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择[]♻️ 自动选择[]🎯 全球直连
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择[]🎯 全球直连
custom_proxy_group=🤖 OpenAi`select`[]🚀 节点选择[]♻️ 自动选择[]🇺🇲 美国节点[]☑️ 手动切换[]DIRECT
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连[]🚀 节点选择
custom_proxy_group=🍎 苹果服务`select`[]🚀 节点选择[]🎯 全球直连
custom_proxy_group=📢 谷歌FCM`select`[]🚀 节点选择[]🎯 全球直连[]♻️ 自动选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择[]🎯 全球直连[]♻️ 自动选择

